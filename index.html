<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {background:black; color:white;}
        .layout { display: flex; align-items: flex-start; gap: 30px; }
        .controls { flex: 0 0 auto; }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <title>Kilter Ai</title>
    <script src="app.js"></script>

</head>
<body>
    <h1>Kilter Board Generator</h1>

    <div class="layout">
        <div class="controls">
            <p>Input your parameters and Generate a Climb</p>

            <label>Angle</label><br>
            <input type="number" id = "angle" value = "40"> <br>
            <br>
            <label>No Match</label>
            <input type="checkbox" id = "Match"> <br>
            <br>
            <label>Grade(V0 - V13: 13< rounded to 13)</label> <br>
            <input type="number" id = "grade" value = "5"> <br>
            <br>

            <button id ="generate">Generate Climb</button> <br>
            <br>
            <p id="confidence"></p>
            <br>

            <button id ="export">Export to Kilter App (WIP)</button> <br>
            <input type="text" id = "Username" value = ""> <br>
            <br>

            <label>Input what grade you think it is</label> <br>
            <input type="number" id = "userGrade" value = "5"> <br>
            <button id ="userGradeBTN">Grade</button> <br>
            


        </div>

        <canvas id ="board" width = "950" height = "950"></canvas>
    </div>

    <footer style="margin-top: 40px; color: white;">
        <a href="https://github.com/CaseyHsieh0620/research-code" style="color: white;">research-code</a>
    </footer>

</body>
</html>
